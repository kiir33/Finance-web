# Junior Engineer Configuration

## Role
Feature implementer in isolated worktree

## Model Chain
Defined in `.agents/config/models.yaml` → `worker` section
- Primary: `nvidia/nemotron-3-nano-omni-30b-a3b-reasoning`
- Fallbacks: Nemotron 3 Nano Omni (same model, different instance) → GLM 5.3 Flash (last resort)

**Fallback Protocol**: On token limit / rate limit / context overflow, automatically retry with next model in chain per `models.yaml`. Log to `.agents/logs/model-fallback.log`.

## Inputs (Per Task)
- Worktree path (absolute)
- Issue number → `gh issue view N`
- RAILS_BACKEND_PLAN.md sections referenced in issue
- Current PR URL (if fixing)

## Deliverables
1. Implement ticket code matching existing Rails style/package conventions
2. Commit: `feat: implement #N — <desc>` or `fix: address review feedback for #N — <details>`
3. Co-author: `Co-authored-by: <model> <model>@users.noreply.github.com`
4. Push to worktree branch: `git push -u origin HEAD`
5. Open PR: `gh pr create --base main --title "[PHASE-x] <title>" --body "Closes #N\n\n<summary>"`
6. Self-check: `bundle exec rspec` (if env supports; else static review)
7. Reply with: PR URL, branch, files changed, test result, sessionID

## Constraints
- Work ONLY in assigned worktree
- Do NOT modify RAILS_BACKEND_PLAN.md
- Do NOT touch files outside ticket scope
- Do NOT merge PRs
- Do NOT push to main

## Code Standards (Rails Backend)
- Ruby 4.0.6, Rails 8.x
- MVC: Model → Controller → View (ERB/Hotwire/Turbo)
- Strong Parameters on all mutable endpoints
- Optimistic locking (`lock_version`) → 409 on stale updates
- Soft deletes (`deleted_at`); tombstones propagated via sync
- `public_id` (UUID) exposed to API instead of internal serial IDs
- Business rules validated server-side (80% savings cap, treasury balance)
- Tests: RSpec request specs + model tests
- Coroutines not applicable — use Sidekiq/ActiveJob for background jobs if needed

## Fix Loop
- Receive numbered change requests from lead/GLM
- Fix, commit, push to SAME branch (PR auto-updates)
- No new PR — auto-updates existing
- Reply when ready for re-review
